<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La_mejor_historia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .contenedor {
            position: relative;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        img {
            width: 100%;
            height: auto;
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            display: block;
            object-fit: contain;
        }
        .boton-regresar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background 0.2s;
            z-index: 10;
        }
        .boton-regresar:hover {
            background: #ff2222;
        }
        .boton-regresar:active {
            transform: translateX(-50%) scale(0.97);
        }
        /* Reproductor visible al inicio */
        .audio {
            position: fixed;
            bottom: 10px;
            right: 10px;
            opacity: 1;
            transition: opacity 3s;
            z-index: 5;
        }
        /* Mensaje para que hagas clic */
        .aviso {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 20;
            opacity: 1;
            transition: opacity 2s;
        }
        @media (max-width: 600px) {
            img {
                max-width: 98vw;
                max-height: 80vh;
                border-radius: 6px;
            }
            .boton-regresar {
                padding: 10px 22px;
                font-size: 16px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="aviso" id="aviso">👆 Haz clic en la imagen para empezar 🎵</div>

    <div class="contenedor" id="contenedor" onclick="iniciarMusica(); siguiente();">
        <img id="imagen" src="uno.png" alt="Imagen">
        <button class="boton-regresar" id="btnRegresar" onclick="event.stopPropagation(); regresar()">⬅ Regresar</button>
    </div>

    <!-- 🎵 Música de fondo en BUCLE INFINITO -->
    <audio class="audio" id="musica" loop>
        <source src="Sorpresa.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    

    <script>
        const imagenes = [
            "uno.png",
            "dos.png",
            "tres.png",
            "cuatro.png",
            "cinco.png",
            "seis.png",
            "siete.png",
            "ocho.png",
            "nueve.png",
            "diez.png",
            "ultima.png"
        ];

        let indice = 0;
        let musicaIniciada = false;
        const img = document.getElementById('imagen');
        const btnRegresar = document.getElementById('btnRegresar');
        const musica = document.getElementById('musica');
        const aviso = document.getElementById('aviso');
        const reproductor = document.getElementById('musica');

        // ▶️ INICIAR MÚSICA al primer clic
        function iniciarMusica() {
            if (!musicaIniciada) {
                musica.play().catch(() => {
                    // Si el navegador bloquea, muestra el botón de reproducir
                    reproductor.style.opacity = "1";
                    alert("🔇 Si no suena, dale al botón ▶ del reproductor abajo a la esquina");
                });
                musicaIniciada = true;
                
                // Ocultar aviso y reproductor despues de unos segundos
                setTimeout(() => {
                    aviso.style.opacity = "0";
                    reproductor.style.opacity = "0";
                    reproductor.style.pointerEvents = "none";
                }, 4000);
            }
        }

        function actualizarImagen() {
            img.src = imagenes[indice];
            btnRegresar.style.display = indice >= 1 ? "block" : "none";
        }

        function siguiente() {
            if (indice < imagenes.length - 1) {
                indice++;
                actualizarImagen();
            }
        }

        function regresar() {
            if (indice > 0) {
                indice--;
                actualizarImagen();
            }
        }
    </script>

</body>
</html>
